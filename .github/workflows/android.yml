name: Build APK Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Siapkan SDK Android
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Uji logika offline
        run: node --test tests/*.test.cjs
      - name: Uji, lint, dan build APK
        run: bash gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: buku-saku-anak-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
